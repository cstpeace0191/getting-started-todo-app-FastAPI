name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write            # Release 생성

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0       # 이전 태그와 비교하려면 전체 이력 필요
          persist-credentials: false
      - name: Create GitHub Release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --generate-notes --verify-tag --title "$TAG"
